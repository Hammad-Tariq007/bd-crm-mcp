<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>BD CRM Analytics</title>
    <!-- No-flash theme: set data-theme before first paint, from the saved preference. -->
    <script>
      (function () {
        try {
          var p = localStorage.getItem("bdmcp_theme") || "system";
          var dark = p === "dark" || (p !== "light" && window.matchMedia("(prefers-color-scheme:dark)").matches);
          document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "light");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
